name: AfterDeath
version: '${version}'
main: com.afterdeath.AfterDeath
api-version: '1.21'
author: AfterDeath
description: Custom PvP head-drop, elimination and Ban Box plugin.
commands:
  afterdeath:
    description: Main AfterDeath command.
    usage: /afterdeath <wand|setworld|setspawn|reload|revive|status>
    aliases: [ad]
permissions:
  afterdeath.admin:
    description: Allows configuring AfterDeath and using admin commands.
    default: op
  afterdeath.bypass:
    description: Bypasses AfterDeath elimination restrictions.
    default: false
