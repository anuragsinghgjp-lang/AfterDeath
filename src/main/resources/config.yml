# Name of the world where AfterDeath mechanics apply. Set with /afterdeath setworld.
headsteal-world: "Headsteal"

# Ban Box is selected with /afterdeath wand:
# left-click = Position 1, right-click = Position 2.
ban-box:
  world: ""
  pos1: null
  pos2: null

# Optional fallback spawn for the Headsteal world. Set with /afterdeath setspawn.
headsteal-spawn: null

messages:
  prefix: "&8[&cAfterDeath&8] &r"
  no-permission: "&cYou don't have permission to do that."
  player-only: "&cThis command can only be used in-game."
  world-set: "&aHeadsteal world set to &e%world%&a."
  pos1: "&aBan Box Position 1 selected: &e%x%, %y%, %z%"
  pos2: "&aBan Box Position 2 selected: &e%x%, %y%, %z%"
  box-incomplete: "&cBan Box is not configured. Use /afterdeath wand and select two blocks."
  box-world-mismatch: "&cBoth Ban Box positions must be in the same world."
  spawn-set: "&aHeadsteal spawn saved."
  wand-given: "&aSelection wand received. Left-click for Position 1, right-click for Position 2."
  eliminated: "&cYou were eliminated! Your head must be placed before you can return to Headsteal."
  head-dropped: "&e%player%'s head dropped! Place it to bring them back."
  revived: "&a%player% has been revived."
  revived-by-head: "&aYour head was placed. You have been revived!"
  not-eliminated: "&cThat player is not eliminated."
  status-eliminated: "&c%player% is eliminated."
  status-alive: "&a%player% is not eliminated."
  reload: "&aConfiguration reloaded."
  usage: "&eUsage: /afterdeath <wand|setworld|setspawn|reload|revive <player>|status <player>>"
